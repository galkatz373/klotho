name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Keep ordinary workspace builds strict. The authoritative Phys golden below
  # additionally pins an x86-64 baseline and disables FMA.
  RUSTFLAGS: "-D warnings -C llvm-args=--fp-contract=off"

jobs:
  check:
    name: fmt · clippy · test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: rustfmt
        shell: bash
        run: |
          cargo fmt --manifest-path engine/Cargo.toml --all -- --check
          cargo fmt --manifest-path studio/Cargo.toml --all -- --check
      - name: engine clippy
        run: cargo clippy --manifest-path engine/Cargo.toml --workspace --all-targets -- -D warnings
      - name: studio clippy
        run: cargo clippy --manifest-path studio/Cargo.toml --workspace --all-targets -- -D warnings
      - name: engine test
        run: cargo test --manifest-path engine/Cargo.toml --workspace
      - name: studio test
        run: cargo test --manifest-path studio/Cargo.toml --workspace
      - name: forbidden imports
        shell: bash
        run: bash scripts/ci/forbidden-imports.sh
      - name: KAI benchmark contract
        run: cargo run --manifest-path studio/Cargo.toml -p klotho-kai-bench -- validate
      - name: Workspace boundary and clean export
        shell: bash
        run: bash scripts/ci/workspace-boundary.sh
      - name: Schema compatibility
        run: cargo run --manifest-path studio/Cargo.toml -p klotho-schema -- check

  phys-golden:
    name: pinned Linux Phys golden
    runs-on: ubuntu-24.04
    env:
      # This is the sole authoritative Phys build contract. Dedicated servers
      # deploy this artifact; do not rebuild Phys with host-native features.
      RUSTFLAGS: "-D warnings -C llvm-args=--fp-contract=off -C target-cpu=x86-64 -C target-feature=-fma"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: Assert pinned ISA runner
        shell: bash
        run: test "$(uname -m)" = x86_64
      - name: Phys residual and long-run goldens
        run: cargo test --manifest-path engine/Cargo.toml -p klotho-phys

  jobs-unsafe:
    name: jobs Miri · Klotho
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Miri steal deque
        # The repository-level rust-toolchain.toml pins stable, so select the
        # nightly toolchain explicitly; Miri is not distributed for stable.
        run: cargo +nightly miri test --manifest-path engine/Cargo.toml -p klotho-jobs --lib
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: Loom owner/thief model
        run: cargo test --manifest-path engine/Cargo.toml -p klotho-jobs --test loom_deque

  runtime-profiles:
    name: AAA runtime profiles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: Adventure profile
        run: cargo test --manifest-path engine/Cargo.toml -p klotho-runtime --features aaa-adventure
      - name: Shooter profile
        run: cargo test --manifest-path engine/Cargo.toml -p klotho-runtime --features aaa-shooter
      - name: Infer OS-process sidecar
        run: cargo test --manifest-path engine/Cargo.toml -p klotho-infer -p klotho-runtime --features klotho-runtime/infer

  cook-farm:
    name: AAA cook farm gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: Incremental and 50 GiB logical fixture
        shell: bash
        run: bash scripts/ci/cook-farm.sh
