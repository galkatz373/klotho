name: ci

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Keep ordinary workspace builds strict. The authoritative Phys golden below
  # additionally pins an x86-64 baseline and disables FMA.
  RUSTFLAGS: "-D warnings -C llvm-args=--fp-contract=off"

jobs:
  check:
    name: fmt · clippy · test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: forbidden imports
        shell: bash
        run: bash scripts/ci/forbidden-imports.sh

  phys-golden:
    name: pinned Linux Phys golden
    runs-on: ubuntu-24.04
    env:
      # This is the sole authoritative Phys build contract. Dedicated servers
      # deploy this artifact; do not rebuild Phys with host-native features.
      RUSTFLAGS: "-D warnings -C llvm-args=--fp-contract=off -C target-cpu=x86-64 -C target-feature=-fma"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: Assert pinned ISA runner
        shell: bash
        run: test "$(uname -m)" = x86_64
      - name: Phys residual and long-run goldens
        run: cargo test -p klotho-phys

  jobs-unsafe:
    name: jobs Miri · Loom
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - name: Miri steal deque
        run: cargo miri test -p klotho-jobs --lib
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: Loom owner/thief model
        run: cargo test -p klotho-jobs --test loom_deque

  runtime-profiles:
    name: AAA runtime profiles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: Adventure profile
        run: cargo test -p klotho-runtime --features aaa-adventure
      - name: Shooter profile
        run: cargo test -p klotho-runtime --features aaa-shooter
