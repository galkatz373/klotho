[workspace]
resolver = "3"
members = [
    "crates/klotho-core",
    "crates/klotho-prove",
    "crates/klotho-ir",
    "crates/klotho-canon",
    "crates/klotho-trace",
    "crates/klotho-world",
    "crates/klotho-commit",
    "crates/klotho-sim",
    "crates/klotho-input",
    "crates/klotho-space",
    "crates/klotho-runtime",
    "examples/hearth-slice",
    "examples/ash-slice",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Gal Katz"]
repository = "https://github.com/galkatz373/klotho"

[workspace.dependencies]
blake3 = "=1.8.7"
klotho-core = { path = "crates/klotho-core" }
klotho-prove = { path = "crates/klotho-prove" }
klotho-ir = { path = "crates/klotho-ir" }
klotho-canon = { path = "crates/klotho-canon" }
klotho-trace = { path = "crates/klotho-trace" }
klotho-world = { path = "crates/klotho-world" }
klotho-commit = { path = "crates/klotho-commit" }
klotho-sim = { path = "crates/klotho-sim" }
klotho-input = { path = "crates/klotho-input" }
klotho-space = { path = "crates/klotho-space" }
ron = "0.11.0"
serde = { version = "1.0.228", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
disallowed_methods = "deny"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
