[package]
name = "klotho-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Klotho platform: window, OS events, Look accumulation (no world mutation)"
readme = false
publish = false

[dependencies]
klotho-core.workspace = true
klotho-input.workspace = true
