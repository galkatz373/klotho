[package]
name = "klotho-world"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Klotho World: private projection of Canon + Trace + Intent"
readme = false
publish = false

[features]
default = []
# Write path. Enable in [dependencies] only from klotho-commit;
# [dev-dependencies] use for tests is allowed and CI-enforced.
mutate = []

[dependencies]
klotho-canon.workspace = true
klotho-core.workspace = true
klotho-ir.workspace = true
klotho-trace.workspace = true

[[bench]]
name = "publish"
harness = false
required-features = ["mutate"]

[[bench]]
name = "place_apply"
harness = false
required-features = ["mutate"]

[lints]
workspace = true
