[workspace]
resolver = "3"
members = [
    "crates/klotho-core",
    "crates/klotho-prove",
    "crates/klotho-ir",
    "crates/klotho-canon",
    "crates/klotho-trace",
    "crates/klotho-world",
    "crates/klotho-commit",
    "crates/klotho-sim",
    "crates/klotho-jobs",
    "crates/klotho-interest",
    "crates/klotho-input",
    "crates/klotho-space",
    "crates/klotho-phys",
    "crates/klotho-anim",
    "crates/klotho-motion",
    "crates/klotho-mind",
    "crates/klotho-infer",
    "crates/klotho-manifest",
    "crates/klotho-compile",
    "crates/klotho-stream",
    "crates/klotho-save",
    "crates/klotho-release",
    "crates/klotho-platform",
    "crates/klotho-render",
    "crates/klotho-audio",
    "crates/klotho-ui",
    "crates/klotho-vfx",
    "crates/klotho-cinematic",
    "crates/klotho-debug",
    "crates/klotho-runtime",
    "crates/klotho-net",
    "crates/klotho-live",
    "examples/hearth-slice",
    "examples/ash-slice",
    "examples/ember-slice",
    "examples/drift-slice",
    "examples/chorus-slice",
    "examples/netlock-slice",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Gal Katz"]
repository = "https://github.com/galkatz373/klotho"

[workspace.dependencies]
blake3 = "=1.8.7"
klotho-core = { path = "crates/klotho-core" }
klotho-prove = { path = "crates/klotho-prove" }
klotho-ir = { path = "crates/klotho-ir" }
klotho-canon = { path = "crates/klotho-canon" }
klotho-trace = { path = "crates/klotho-trace" }
klotho-world = { path = "crates/klotho-world" }
klotho-commit = { path = "crates/klotho-commit" }
klotho-sim = { path = "crates/klotho-sim" }
klotho-jobs = { path = "crates/klotho-jobs" }
klotho-interest = { path = "crates/klotho-interest" }
klotho-input = { path = "crates/klotho-input" }
klotho-space = { path = "crates/klotho-space" }
klotho-phys = { path = "crates/klotho-phys" }
klotho-anim = { path = "crates/klotho-anim" }
klotho-motion = { path = "crates/klotho-motion" }
klotho-mind = { path = "crates/klotho-mind" }
klotho-infer = { path = "crates/klotho-infer" }
klotho-manifest = { path = "crates/klotho-manifest" }
klotho-compile = { path = "crates/klotho-compile" }
klotho-stream = { path = "crates/klotho-stream" }
klotho-save = { path = "crates/klotho-save" }
klotho-platform = { path = "crates/klotho-platform" }
memmap2 = "0.9"
klotho-render = { path = "crates/klotho-render" }
klotho-audio = { path = "crates/klotho-audio" }
klotho-ui = { path = "crates/klotho-ui" }
klotho-vfx = { path = "crates/klotho-vfx" }
klotho-cinematic = { path = "crates/klotho-cinematic" }
klotho-debug = { path = "crates/klotho-debug" }
klotho-net = { path = "crates/klotho-net" }
klotho-live = { path = "crates/klotho-live" }
ron = "0.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "=0.10.9"
ed25519-dalek = "=2.1.1"
klotho-release = { path = "crates/klotho-release" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
disallowed_methods = "deny"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
