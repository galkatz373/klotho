[package]
name = "klotho-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Klotho headless runtime: plays an Intent script or .warp through klotho-sim"
readme = false
publish = false

[lib]
name = "klotho_runtime"
path = "src/lib.rs"

[[bin]]
name = "klotho-runtime"
path = "src/main.rs"

[[bin]]
name = "klotho-server"
path = "src/bin/klotho-server.rs"
required-features = ["net-dedicated"]

[features]
default = []
net = ["dep:klotho-net"]
net-listen = ["net"]
net-dedicated = ["net"]
phys = []
jobs = []
stream = []
infer = []
profile = []
editor = []
aaa-adventure = ["phys", "jobs", "stream"]
aaa-shooter = ["phys", "jobs", "net-dedicated"]

[dependencies]
klotho-net = { workspace = true, optional = true }
hearth-slice = { path = "../../examples/hearth-slice" }
klotho-commit.workspace = true
klotho-compile.workspace = true
klotho-core.workspace = true
klotho-input.workspace = true
klotho-ir.workspace = true
klotho-manifest.workspace = true
klotho-platform.workspace = true
klotho-sim.workspace = true
klotho-stream.workspace = true
klotho-jobs.workspace = true
klotho-interest.workspace = true
klotho-world.workspace = true
klotho-space.workspace = true
klotho-motion.workspace = true
klotho-mind.workspace = true
klotho-infer.workspace = true
klotho-ui.workspace = true
klotho-phys.workspace = true

[lints]
workspace = true

[dev-dependencies]
klotho-save.workspace = true
klotho-trace.workspace = true
