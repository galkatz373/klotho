[workspace]
resolver = "3"
members = [
    "crates/klotho-schema",
    "crates/klotho-author",
    "crates/klotho-editor",
    "crates/klotho-dcc",
    "crates/klotho-kai-bench",
    "crates/klotho-ai",
    "crates/klotho-pattern",
    "crates/klotho-eval",
    "crates/klotho-dialogue",
    "crates/klotho-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Gal Katz"]
repository = "https://github.com/galkatz373/klotho"

[workspace.dependencies]
blake3 = "=1.8.7"
klotho-core = { path = "../engine/crates/klotho-core" }
klotho-prove = { path = "../engine/crates/klotho-prove" }
klotho-ir = { path = "../engine/crates/klotho-ir" }
klotho-canon = { path = "../engine/crates/klotho-canon" }
klotho-trace = { path = "../engine/crates/klotho-trace" }
klotho-world = { path = "../engine/crates/klotho-world" }
klotho-commit = { path = "../engine/crates/klotho-commit" }
klotho-manifest = { path = "../engine/crates/klotho-manifest" }
klotho-compile = { path = "../engine/crates/klotho-compile" }
klotho-render = { path = "../engine/crates/klotho-render" }
klotho-ui = { path = "../engine/crates/klotho-ui" }
klotho-schema = { path = "crates/klotho-schema" }
klotho-author = { path = "crates/klotho-author" }
klotho-ai = { path = "crates/klotho-ai" }
klotho-pattern = { path = "crates/klotho-pattern" }
klotho-eval = { path = "crates/klotho-eval" }
klotho-dialogue = { path = "crates/klotho-dialogue" }
klotho-kai-bench = { path = "crates/klotho-kai-bench" }
klotho-debug = { path = "../engine/crates/klotho-debug" }
klotho-input = { path = "../engine/crates/klotho-input" }
klotho-anim = { path = "../engine/crates/klotho-anim" }
ron = "0.11.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "=0.10.9"
ed25519-dalek = "=2.1.1"
klotho-dcc = { path = "crates/klotho-dcc" }
klotho-worker = { path = "crates/klotho-worker" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
dbg_macro = "deny"
disallowed_methods = "deny"
todo = "warn"
unimplemented = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
